name: el3yada
description: "el3yada: clinic app for doctors, assistants, patients and admins"
publish_to: 'none'
version: 0.1.0+1

environment:
  # Needs Flutter 3.50 (Dart 3.14): pdfrx 3 requires it, and Material now comes
  # from the material_ui package. CI uses the same version (.github/workflows/ci.yml).
  # The lower bound stays 3.12.1 on purpose: it sets the language version, and
  # the generated freezed code doesn't compile under 3.14's constructor rules.
  sdk: ^3.12.1
  flutter: ">=3.50.0"

dependencies:
  animations: ^3.0.0
  # Shared with the catalog builder: search normalization, schema, FTS5 SQL
  # (spec A.6, 9.5).
  catalog_core:
    path: ../packages/catalog_core
  # sha256 of the downloaded catalog (D0, spec 9.5).
  crypto: ^3.0.8
  cunning_document_scanner: ^3.1.0
  desktop_drop: ^0.8.4
  dio: ^5.11.1
  drift: ^2.34.4
  file_picker: ^13.4.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image: ^4.13.1
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  lottie: ^3.7.0
  open_filex: ^5.0.0
  package_info_plus: ^10.2.2
  path_provider: ^2.1.6
  pdfrx: ^3.0.3
  pdf: ^3.13.1
  printing: ^5.15.1
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  signalr_netcore: ^1.4.4
  skeletonizer: ^3.0.0
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3
  uuid: ^4.6.0
  fl_chart: ^1.3.1

  # Material widgets, moved out of the Flutter SDK in 3.47.
  material_ui: ^1.11.1
  # Cupertino localizations for Material widgets (lib/l10n/app_localization_delegates.dart).
  cupertino_ui: ^1.0.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  drift_dev: ^2.34.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true

  # Lottie animations (100 KB or less each). Sources and licences:
  # assets/lottie/SOURCES.txt.
  assets:
    - assets/lottie/
    # Arabic text in prescription PDFs (spec 6.4.1); the app's own text uses Alexandria.
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf

  # Alexandria (SIL Open Font License, assets/fonts/OFL-Alexandria.txt) covers
  # Arabic and Latin, so both languages look the same on every platform and
  # work offline (spec section 12). Bundled as static weights.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700

# Phase 8: app icons from brand/el3yada-icon.png (`dart run flutter_launcher_icons`).
flutter_launcher_icons:
  image_path: ../brand/el3yada-icon.png
  android: true
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#104D47"
  adaptive_icon_background: "#104D47"
  adaptive_icon_foreground: ../brand/el3yada-icon.png
  windows:
    generate: true
    image_path: ../brand/el3yada-icon.png
    icon_size: 256
  macos:
    generate: true
    image_path: ../brand/el3yada-icon.png

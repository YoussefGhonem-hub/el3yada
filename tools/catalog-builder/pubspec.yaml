name: catalog_builder
description: >-
  Builds the el3yada medical catalog (medicines, LOINC lab tests and
  radiology) into one compressed SQLite file for the apps (spec section 9.5
  and Appendix A).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dependencies:
  args: ^2.7.0
  catalog_core:
    path: ../../packages/catalog_core
  crypto: ^3.0.6
  path: ^1.9.1
  sqlite3: ^3.5.2

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0

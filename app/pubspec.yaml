name: el3yada
description: "el3yada: clinic app for doctors, assistants, patients and admins"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dio: ^5.11.1
  file_picker: ^13.4.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^23.0.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.2
  pdfrx: ^3.0.3
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  signalr_netcore: ^1.4.4
  url_launcher: ^6.3.3
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true


# Builds the iOS app on a GitHub Mac and uploads it to TestFlight.
#
# Runs by itself on every push to the `uat` branch that changes the app
# (app/, packages/ or this file). To deploy: merge dev into uat and push.
# It can also be started by hand: Actions tab > "iOS TestFlight" > Run
# workflow (GitHub shows that button only once this file is on main), or
#   gh workflow run "iOS TestFlight" --ref dev -f config=demo
#
# A push to uat builds against the UAT API (config/uat.json), which the
# "Deploy UAT" workflow publishes from the same push.
#
# The app's analyze and tests run first on Linux; the Mac build starts only
# if they pass.
#
# Needs four repository secrets (Settings > Secrets and variables > Actions).
# How to get them: app/README.md, "iOS: TestFlight".
#   APP_STORE_CONNECT_ISSUER_ID       Issuer ID of the App Store Connect API key
#   APP_STORE_CONNECT_KEY_IDENTIFIER  Key ID of that key
#   APP_STORE_CONNECT_PRIVATE_KEY     The key's AuthKey_<id>.p8 file, whole
#   CERTIFICATE_PRIVATE_KEY           RSA key of the distribution certificate
#
# The first run creates the distribution certificate and the App Store
# profile for com.el3yada.app. Later runs find and reuse them.
name: iOS TestFlight

on:
  push:
    branches: [uat]
    paths:
      - "app/**"
      - "packages/**"
      - ".github/workflows/ios-testflight.yml"
  workflow_dispatch:
    inputs:
      config:
        description: "uat = the UAT API (config/uat.json). demo = offline test accounts, no server needed. prod = config/prod.json (needs the real API URL)."
        type: choice
        options: [uat, demo, prod]
        default: uat

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  test:
    name: App (analyze and test)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true
      # The desktop tray packages (cnativeapi) compile native code when the
      # tests build, and on Linux that needs these development libraries.
      - name: Linux libraries for native assets (GTK 3, X11, Xi)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  testflight:
    name: Build and upload
    needs: test
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: app
    env:
      BUNDLE_ID: com.el3yada.app
      # A push to uat has no inputs, so it builds against the UAT API.
      CONFIG_CHOICE: ${{ inputs.config || 'uat' }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.APP_STORE_CONNECT_KEY_IDENTIFIER }}
      APP_STORE_CONNECT_PRIVATE_KEY: ${{ secrets.APP_STORE_CONNECT_PRIVATE_KEY }}
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Secrets are set
        working-directory: .
        run: |
          missing=""
          for name in APP_STORE_CONNECT_ISSUER_ID APP_STORE_CONNECT_KEY_IDENTIFIER APP_STORE_CONNECT_PRIVATE_KEY CERTIFICATE_PRIVATE_KEY; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing. See app/README.md, iOS: TestFlight."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Choose the config
        run: |
          if [ "$CONFIG_CHOICE" = prod ]; then
            if grep -q 'example\.com' config/prod.json; then
              echo "::error::config/prod.json still points at api.example.com. Put the real API URL there first, or run with config=demo."
              exit 1
            fi
            echo "CONFIG_FILE=config/prod.json" >> "$GITHUB_ENV"
          elif [ "$CONFIG_CHOICE" = uat ]; then
            echo "CONFIG_FILE=config/uat.json" >> "$GITHUB_ENV"
          else
            echo "CONFIG_FILE=config/dev-offline.json" >> "$GITHUB_ENV"
          fi

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.50.1
          cache: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Codemagic CLI tools (signing and upload)
        run: pip install codemagic-cli-tools==0.70.2

      - run: flutter pub get

      - name: Signing (certificate and App Store profile)
        run: |
          keychain initialize
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --strict-match-identifier \
            --create
          keychain add-certificates
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build the IPA
        run: |
          flutter build ipa --release \
            --dart-define-from-file="$CONFIG_FILE" \
            --build-number="$GITHUB_RUN_NUMBER" \
            --export-options-plist="$HOME/export_options.plist"

      - name: Upload to App Store Connect
        run: app-store-connect publish --path "build/ios/ipa/*.ipa"

      - name: Summary
        run: |
          version=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          {
            echo "### Uploaded to TestFlight"
            echo "- Version $version, build $GITHUB_RUN_NUMBER"
            echo "- Branch $GITHUB_REF_NAME, commit ${GITHUB_SHA:0:7}"
            echo "- Config: $CONFIG_FILE"
            echo "- Apple processes the build for 5 to 30 minutes, then internal testers get it in the TestFlight app."
          } >> "$GITHUB_STEP_SUMMARY"

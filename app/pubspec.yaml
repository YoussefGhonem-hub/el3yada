name: el3yada
description: "el3yada: clinic app for doctors, assistants, patients and admins"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  dio: ^5.11.1
  drift: ^2.34.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  pdf: ^3.13.1
  shared_preferences: ^2.5.6
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true

  # Alexandria (SIL Open Font License, assets/fonts/OFL-Alexandria.txt) covers
  # Arabic and Latin, so both languages look the same on every platform and
  # work offline (spec section 12). Bundled as static weights.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700

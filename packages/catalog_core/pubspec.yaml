name: catalog_core
description: >-
  Shared code for the el3yada medical catalog: search normalization, the
  strength parser, the local database schema and FTS5 query helpers. Used by
  the catalog builder (tools/catalog-builder) and by the app, so both sides
  normalize text the same way (spec Appendix A.6).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.12.0

dev_dependencies:
  lints: ^6.1.0
  test: ^1.29.0

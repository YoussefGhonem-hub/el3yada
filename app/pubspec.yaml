name: el3yada
description: "el3yada: clinic app for doctors, assistants, patients and admins"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  animations: ^3.0.0
  dio: ^5.11.1
  drift: ^2.34.4
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.5.0
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.4.0
  freezed_annotation: ^3.1.0
  go_router: ^18.1.4
  image_picker: ^1.2.4
  intl: ^0.20.2
  json_annotation: ^4.12.0
  lottie: ^3.7.0
  package_info_plus: ^10.2.2
  pdf: ^3.13.1
  printing: ^5.14.3
  shared_preferences: ^2.5.6
  skeletonizer: ^3.0.0
  sqlite3: ^3.5.2
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  freezed: ^3.2.5
  json_serializable: ^6.15.2
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  # Generates lib/l10n/gen/app_localizations.dart from the ARB files (see l10n.yaml).
  generate: true

  # Lottie animations (100 KB or less each). Sources and licences:
  # assets/lottie/SOURCES.txt.
  assets:
    - assets/lottie/
    # Arabic text in prescription PDFs (spec 6.4.1); the app's own text uses Alexandria.
    - assets/fonts/NotoSansArabic-Regular.ttf
    - assets/fonts/NotoSansArabic-Bold.ttf

  # Alexandria (SIL Open Font License, assets/fonts/OFL-Alexandria.txt) covers
  # Arabic and Latin, so both languages look the same on every platform and
  # work offline (spec section 12). Bundled as static weights.
  fonts:
    - family: Alexandria
      fonts:
        - asset: assets/fonts/Alexandria-Regular.ttf
          weight: 400
        - asset: assets/fonts/Alexandria-Medium.ttf
          weight: 500
        - asset: assets/fonts/Alexandria-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Alexandria-Bold.ttf
          weight: 700
